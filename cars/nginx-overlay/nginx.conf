worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 200M;

  # gzip отключаем — sub_filter не работает на gzip-encoded ответах
  proxy_set_header Accept-Encoding "";

  server {
    listen 8080;
    server_name _;

    # serve our overlay script
    location = /__labelstudia-overlay.js {
      root /usr/share/nginx/static;
      try_files /overlay.js =404;
      add_header Cache-Control "public, max-age=300";
      add_header Content-Type "application/javascript; charset=utf-8";
    }

    # serve health endpoint
    location = /__overlay-health {
      access_log off;
      add_header Content-Type "text/plain";
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://ls-backend:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 600s;

      # inject script tag into HTML responses
      sub_filter '</body>' '<script src="/__labelstudia-overlay.js" defer></script></body>';
      sub_filter_once on;
      sub_filter_types text/html;
    }
  }
}
